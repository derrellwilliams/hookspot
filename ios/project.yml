# Source of truth for HookSpot.xcodeproj — regenerate with `cd ios && xcodegen`.
# Folders are synchronized, so adding/removing Swift files needs no regeneration.
name: HookSpot
options:
  bundleIdPrefix: com.hookspot
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.0.0"
targets:
  HookSpot:
    type: application
    platform: iOS
    sources:
      - path: HookSpot
        type: syncedFolder
    dependencies:
      - package: Supabase
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    info:
      path: Config/HookSpot-Info.plist
      properties:
        CFBundleDisplayName: Hook Spot
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Hook Spot uses your photos to add catches.
        NSCameraUsageDescription: Hook Spot uses your camera to photograph catches.
        NSLocationWhenInUseUsageDescription: Hook Spot uses your location to place catches on the map.
        HSSupabaseURL: $(SUPABASE_URL)
        HSSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        HSMapboxPublicToken: $(MAPBOX_PUBLIC_TOKEN)
        HSAPIBaseURL: $(API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hookspot.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HookSpotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HookSpotTests
        type: syncedFolder
    dependencies:
      - target: HookSpot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HookSpot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HookSpot
schemes:
  HookSpot:
    build:
      targets:
        HookSpot: all
        HookSpotTests: [test]
    test:
      targets: [HookSpotTests]
