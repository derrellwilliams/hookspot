name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The app uses iOS 27 SDK APIs (behind #available), so build with the newest Xcode
      # on the runner image.
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # No secrets needed: Base.xcconfig builds with empty values (Secrets.xcconfig is an
      # optional include) and Mapbox Maps v11 resolves over SPM without a download token.
      - name: Build and test
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator $SIM"
          xcodebuild -project HookSpot.xcodeproj -scheme HookSpot \
            -destination "id=$SIM" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build test
