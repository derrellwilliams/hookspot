name: Keep Supabase awake

# Supabase pauses free-tier projects after ~7 days of low activity, so run a
# real query against the REST API twice a day. The URL and publishable key
# are public (they ship in the web bundle) and profiles are publicly readable.
#
# GitHub disables scheduled workflows after 60 days without a commit to the
# repo (it emails first) — re-enable from the Actions tab if that happens.
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: sb_publishable_NMDjLD_rneFKD23mtYao8Q_NaMjrwzE" \
            "https://wbpthjnugpmwzcakykcq.supabase.co/rest/v1/profiles?select=id&limit=1"
