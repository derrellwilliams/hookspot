name: Keep Supabase awake

# Backup for the Vercel cron in vercel.json: Supabase pauses free-tier
# projects after ~7 days of low activity, so ping the keep-alive endpoint
# (which runs a real query) twice a day from a second source.
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 30 -H "Authorization: Bearer $CRON_SECRET" https://hook-spot.com/api/keep-alive
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
